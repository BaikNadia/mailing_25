<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления рассылками</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Панель управления рассылками</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Всего рассылок</h5>
                    <p class="card-text display-6">{{ total_mailings }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Активных рассылок</h5>
                    <p class="card-text display-6">{{ active_mailings }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Уникальных получателей</h5>
                    <p class="card-text display-6">{{ unique_clients }}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-secondary me-2">Рассылки</a>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-secondary me-2">Получатели</a>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-secondary">Сообщения</a>
    </div>
</div>
</body>
</html>
