<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рассылки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1>Список рассылок</h1>

    <a href="{% url 'mailing:mailing_create' %}" class="btn btn-success mb-3">Создать рассылку</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Статус</th>
            <th>Первая отправка</th>
            <th>Кол-во получателей</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        {% for mailing in mailings %}
        <tr>
            <td>{{ mailing.id }}</td>
            <td>{{ mailing.get_status_display }}</td>
            <td>{{ mailing.first_send }}</td>
            <td>{{ mailing.clients.count }}</td>
            <td>
                <a href="{% url 'mailing:mailing_detail' mailing.id %}" class="btn btn-sm btn-info">Детали</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">Нет рассылок</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'mailing:dashboard' %}" class="btn btn-secondary">Назад</a>
</div>
</body>
</html>
